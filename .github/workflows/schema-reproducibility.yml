name: Schema Reproducibility (DR)

# SECRET GEREKTİRMEZ. Tüm migration'ları sıfırdan boş bir postgres'e uygular.
# Neyi kanıtlar: migration dosyaları vanilla postgres:15 + Supabase stub'ları
# (auth/storage/roller/varsayılan yetkiler/pg_cron) üzerinde hatasız uygulanır;
# listelenen kritik tablolar ve uygulamanın kullandığı belirli nesneler
# (RLS/policy/index/yetki dahil) oluşur.
# Neyi KANITLAMAZ: canlı şemayla tam eşitlik (diff yapılmaz), stub'lanan
# Supabase şemalarının içeriği, cron zamanlamaları, veri, depolama nesneleri.
# Repoda dosyası olmayan ama canlıya uygulanmış bir migration ancak sonraki bir
# migration ona dayanırsa ya da aşağıdaki kontrollerde yer alırsa yakalanır.

on:
  push:
    paths:
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'supabase/migrations/**'
  schedule:
    - cron: '0 3 * * 1'   # her Pazartesi 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reproduce-schema:
    runs-on: ubuntu-latest
    services:
      pg:
        # Vanilla postgres: 'postgres' superuser public schema'ya tam yetkili.
        # Supabase'e özgü auth/storage/roller bootstrap step'inde stub'lanır.
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: psql kur
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Supabase ortamını stub'la (auth/storage/roller/extension)
        env:
          DB: postgresql://postgres:test@localhost:5432/testdb
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          -- Extensions (migration'ların beklediği)
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          -- Roller
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          -- Supabase platformunun public şemasındaki varsayılan yetkileri (uygulama
          -- nesnesi değil). Bunlar olmadan migration'lardaki REVOKE'ların sonucu
          -- canlıdakiyle karşılaştırılamaz.
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;
          -- Schema'lar
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS storage;
          -- auth.users stub (profiles vb. FK referansları için)
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text,
            encrypted_password text,
            raw_user_meta_data jsonb,
            raw_app_meta_data jsonb,
            phone text,
            email_confirmed_at timestamptz,
            last_sign_in_at timestamptz,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          -- storage.objects stub (storage policy migration'ları için)
          CREATE TABLE IF NOT EXISTS storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text,
            name text,
            owner uuid,
            created_at timestamptz DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY,
            name text,
            owner uuid,
            public boolean DEFAULT false,
            avif_autodetection boolean DEFAULT false,
            file_size_limit bigint,
            allowed_mime_types text[],
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          -- auth.* helper stub'ları (RLS policy CREATE'i için var olması yeter)
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT NULL::text $$;
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $$ SELECT '{}'::jsonb $$;
          -- storage.foldername stub (storage policy migration'ları için)
          CREATE OR REPLACE FUNCTION storage.foldername(name text) RETURNS text[] LANGUAGE sql IMMUTABLE AS $$ SELECT string_to_array(name, '/') $$;
          -- pg_cron stub: vanilla postgres'te pg_cron yok; cron.job'u okuyan /
          -- cron.schedule çağıran migration'lar için yeterli yüzey. Zamanlama
          -- runtime altyapısıdır, şema reproducibility'nin parçası değildir.
          CREATE SCHEMA IF NOT EXISTS cron;
          CREATE TABLE IF NOT EXISTS cron.job (
            jobid bigserial PRIMARY KEY,
            schedule text NOT NULL,
            command text NOT NULL,
            jobname text UNIQUE
          );
          CREATE OR REPLACE FUNCTION cron.schedule(job_name text, schedule text, command text) RETURNS bigint
            LANGUAGE sql AS $$
              INSERT INTO cron.job (jobname, schedule, command) VALUES (job_name, schedule, command)
              ON CONFLICT (jobname) DO UPDATE SET schedule = EXCLUDED.schedule, command = EXCLUDED.command
              RETURNING jobid $$;
          CREATE OR REPLACE FUNCTION cron.unschedule(job_name text) RETURNS boolean
            LANGUAGE sql AS $$ WITH d AS (DELETE FROM cron.job WHERE jobname = job_name RETURNING 1) SELECT EXISTS (SELECT 1 FROM d) $$;
          CREATE OR REPLACE FUNCTION cron.unschedule(job_id bigint) RETURNS boolean
            LANGUAGE sql AS $$ WITH d AS (DELETE FROM cron.job WHERE jobid = job_id RETURNING 1) SELECT EXISTS (SELECT 1 FROM d) $$;
          SQL
          echo "✅ Supabase ortamı stub'landı"

      - name: Tüm migration'ları sırayla uygula
        env:
          DB: postgresql://postgres:test@localhost:5432/testdb
        run: |
          set -e
          COUNT=0
          for m in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $m"
            psql "$DB" -v ON_ERROR_STOP=1 -f "$m"
            COUNT=$((COUNT+1))
          done
          echo "✅ $COUNT migration boş postgres'e hatasız uygulandı"

      - name: Kritik tabloların varlığını doğrula
        env:
          DB: postgresql://postgres:test@localhost:5432/testdb
        run: |
          for t in stores products orders order_items return_requests withdrawal_requests \
                   store_transactions customer_claims profiles coupons; do
            EXISTS=$(psql "$DB" -tAc "SELECT to_regclass('public.$t') IS NOT NULL;")
            if [ "$EXISTS" != "t" ]; then
              echo "::error::Kritik tablo migration'larda eksik: $t"
              exit 1
            fi
          done
          echo "✅ Tüm kritik tablolar sıfırdan kurulabiliyor"

      - name: Uygulamanın kullandığı nesneleri ve güvenlik ayarlarını doğrula
        env:
          DB: postgresql://postgres:test@localhost:5432/testdb
        run: |
          # Her satır: açıklama | true dönmesi gereken sorgu. Değerler canlıdan
          # (2026-11-11) okunan durumla eşlenmiştir; uygulama kodu bu nesneleri
          # kullanıyor (2FA, reklam bakiyesi, destek).
          fail=0
          while IFS='|' read -r label sql; do
            [ -z "$label" ] && continue
            got=$(psql "$DB" -tAc "$sql")
            if [ "$got" = "t" ]; then echo "✓ $label"; else echo "::error::$label"; fail=1; fi
          done <<'CHECKS'
          auth_otp_codes tablosu, RLS açık, hiç policy yok (yalnız service role)|SELECT to_regclass('public.auth_otp_codes') IS NOT NULL AND (SELECT relrowsecurity FROM pg_class WHERE oid='public.auth_otp_codes'::regclass) AND NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='auth_otp_codes')
          auth_otp_codes.idx_auth_otp_user|SELECT to_regclass('public.idx_auth_otp_user') IS NOT NULL
          stores.ad_balance numeric NOT NULL DEFAULT 0|SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='stores' AND column_name='ad_balance' AND data_type='numeric' AND is_nullable='NO' AND column_default='0')
          credit_ad_balance SECURITY DEFINER, anon/authenticated EXECUTE yok, service_role var|SELECT p.prosecdef AND NOT has_function_privilege('anon',p.oid,'EXECUTE') AND NOT has_function_privilege('authenticated',p.oid,'EXECUTE') AND has_function_privilege('service_role',p.oid,'EXECUTE') FROM pg_proc p WHERE p.oid='public.credit_ad_balance(uuid,numeric,text,text,text,uuid)'::regprocedure
          debit_ad_balance SECURITY DEFINER, anon/authenticated EXECUTE yok, service_role var|SELECT p.prosecdef AND NOT has_function_privilege('anon',p.oid,'EXECUTE') AND NOT has_function_privilege('authenticated',p.oid,'EXECUTE') AND has_function_privilege('service_role',p.oid,'EXECUTE') FROM pg_proc p WHERE p.oid='public.debit_ad_balance(uuid,numeric,uuid,text)'::regprocedure
          idx_stores_iyzico_sub_merchant_key (kısmi index)|SELECT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='idx_stores_iyzico_sub_merchant_key' AND indexdef LIKE '%WHERE (iyzico_sub_merchant_key IS NOT NULL)%')
          ad_balance_transactions/topups RLS + satıcı okuma policy'leri|SELECT (SELECT relrowsecurity FROM pg_class WHERE oid='public.ad_balance_transactions'::regclass) AND (SELECT relrowsecurity FROM pg_class WHERE oid='public.ad_balance_topups'::regclass) AND EXISTS (SELECT 1 FROM pg_policies WHERE tablename='ad_balance_transactions' AND policyname='seller reads own ad tx') AND EXISTS (SELECT 1 FROM pg_policies WHERE tablename='ad_balance_topups' AND policyname='seller reads own topups')
          support_tickets/support_messages RLS + kullanıcı okuma policy'leri|SELECT (SELECT relrowsecurity FROM pg_class WHERE oid='public.support_tickets'::regclass) AND (SELECT relrowsecurity FROM pg_class WHERE oid='public.support_messages'::regclass) AND EXISTS (SELECT 1 FROM pg_policies WHERE tablename='support_tickets' AND policyname='user reads own tickets') AND EXISTS (SELECT 1 FROM pg_policies WHERE tablename='support_messages' AND policyname='user reads own ticket messages')
          CHECKS
          exit $fail
